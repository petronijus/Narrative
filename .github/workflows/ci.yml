name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    # Runs in parallel with CI — build validation does not depend on test results
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: narrative-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: narrative-web:ci
          # VITE env vars for build time (dev values — validates the build passes)
          build-args: |
            VITE_API_URL=http://localhost:3001
            VITE_HOCUSPOCUS_URL=ws://localhost:3002
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build video-worker image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/video-worker/Dockerfile
          push: false
          tags: narrative-video-worker:ci
          cache-from: type=gha,scope=video-worker
          cache-to: type=gha,mode=max,scope=video-worker

      # MinIO and imgproxy use upstream pre-built images (no project Dockerfile).
      # Validate compose config parses correctly with required env vars stubbed out.
      - name: Validate docker-compose config (base + prod overlay)
        working-directory: infra
        env:
          # Stub required env vars — values are irrelevant for config validation
          POSTGRES_PASSWORD: ci-stub
          MINIO_ROOT_USER: ci-stub
          MINIO_ROOT_PASSWORD: ci-stub
          IMGPROXY_KEY: ci-stub
          IMGPROXY_SALT: ci-stub
          DOMAIN: ci.example.com
          CLOUDFLARE_TUNNEL_TOKEN: ci-stub
          CLOUDFLARED_VERSION: '2024.10.1'
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
