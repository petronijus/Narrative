name: Load Test

# Nespouští se při normálních PR — jen ručně nebo weekly cron.
# Neblokuje CI — je to separátní workflow.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server HTTP URL (default: starts ephemeral server)'
        required: false
        default: ''
  schedule:
    # Neděle 4:00 UTC
    - cron: '0 4 * * 0'

concurrency:
  group: load-test
  cancel-in-progress: true

jobs:
  load-test:
    name: Synthetic Load Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: narrative
          POSTGRES_USER: narrative
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install load test dependencies
        run: cd tests/load && npm install

      - name: Build server
        run: pnpm --filter server build

      - name: Start server
        env:
          POSTGRES_URL: postgres://narrative:testpassword@localhost:5432/narrative
          NODE_ENV: test
          API_PORT: '3001'
          HOCUSPOCUS_PORT: '3002'
        run: |
          pnpm --filter server start &
          echo $! > /tmp/server.pid
          # Počkej na start
          timeout 30 bash -c 'until curl -sf http://localhost:3001/health; do sleep 1; done'
          echo "Server ready"

      - name: Run load tests
        env:
          NARRATIVE_SERVER_HTTP: http://localhost:3001
          NARRATIVE_SERVER_WS: ws://localhost:3002
        run: pnpm load:all

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi
