[package]
name = "narrative-desktop-tauri"
version = "0.15.0"
description = "Narrative desktop app — Tauri prototype beside the Electron shell"
edition = "2021"
publish = false

[lib]
name = "narrative_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
tokio = { version = "1", features = ["sync"] }

[features]
# The performance harness's driver (src/perf_driver.rs, docs/plans/performance.md
# → W1): native input on stdin, a local driver evaluating scripts in the page.
# Debug builds only (the module refuses to compile in a release build).
perf-driver = [
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:objc2-core-graphics",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "NSArray",
  "NSGeometry",
  "NSProcessInfo",
  "NSString",
] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventTypes",
  "CGRemoteOperation",
] }
