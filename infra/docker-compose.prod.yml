# Narrative — Docker Compose production override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs base compose:
#   - Server ports bound to 127.0.0.1 (Caddy sits in front)
#   - Caddy service with auto-TLS
#   - Postgres volume on ZFS dataset (PG_DATA_PATH env var)
#   - Authentik HTTP port bound to 127.0.0.1 (proxied via auth.DOMAIN subdomain)
#   - Authentik volumes on ZFS dataset (AUTHENTIK_DATA_PATH env var)
#   - MinIO ports bound to 127.0.0.1, data on ZFS (MINIO_DATA_PATH env var) [M11]
#   - imgproxy port bound to 127.0.0.1, IMGPROXY_REPORT_DOWNLOADING_ERRORS=false [M11]
#   - media-redis port bound to 127.0.0.1, data on ZFS (MEDIA_REDIS_DATA_PATH env var) [M12]
#   - video-worker restart=always; resource limits deferred to M29 [M12]
#   - Restart policy `always`
#   - env_file: .env.prod (gitignored)

services:
  postgres:
    restart: always
    volumes:
      # ZFS dataset mount — set PG_DATA_PATH in .env.prod
      # Example: PG_DATA_PATH=/mnt/tank/narrative/postgres
      - ${PG_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    # Expose only on localhost — Caddy / server access via internal network
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  server:
    restart: always
    environment:
      NODE_ENV: production
      # In prod Caddy sends Origin as DOMAIN
      CORS_ORIGIN: https://${DOMAIN}
    ports:
      # Bind to 127.0.0.1 only — Caddy reverse-proxies
      - '127.0.0.1:${API_PORT:-3001}:3001'
      - '127.0.0.1:${HOCUSPOCUS_PORT:-3002}:3002'

  # ─── Authentik prod overrides ─────────────────────────────────────────────────
  authentik-postgres:
    restart: always
    volumes:
      # ZFS dataset mount — set AUTHENTIK_DATA_PATH in .env.prod
      # Example: AUTHENTIK_DATA_PATH=/mnt/tank/narrative/authentik
      - ${AUTHENTIK_DATA_PATH:-authentik_pg_data}/postgres:/var/lib/postgresql/data
    ports: [] # no external port in prod — internal network only

  authentik-server:
    restart: always
    ports:
      # Bind to localhost — proxied by Caddy as auth.DOMAIN
      - '127.0.0.1:${AUTHENTIK_HTTP_PORT:-9000}:9000'
    volumes:
      - ${AUTHENTIK_DATA_PATH:-authentik_media}/media:/media
      - ${AUTHENTIK_DATA_PATH:-authentik_certs}/certs:/certs
      - ./authentik/blueprints/custom:/blueprints/custom:ro

  authentik-worker:
    restart: always
    volumes:
      - ${AUTHENTIK_DATA_PATH:-authentik_media}/media:/media
      - ${AUTHENTIK_DATA_PATH:-authentik_certs}/certs:/certs
      - ./authentik/blueprints/custom:/blueprints/custom:ro

  # ─── MinIO prod overrides (M11) ──────────────────────────────────────────────
  minio:
    restart: always
    volumes:
      # ZFS dataset mount — set MINIO_DATA_PATH in .env.prod
      # Example: MINIO_DATA_PATH=/mnt/tank/narrative/minio
      - ${MINIO_DATA_PATH:-minio_data}:/data
    ports:
      # Bind to localhost — Caddy + internal Docker network only
      - '127.0.0.1:${MINIO_API_PORT:-9100}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001'

  imgproxy:
    restart: always
    environment:
      # Suppress verbose download error logs in prod; errors still tracked via Sentry (M29)
      IMGPROXY_REPORT_DOWNLOADING_ERRORS: 'false'
    ports:
      # Bind to localhost — Caddy proxies /imgproxy/* to this port
      - '127.0.0.1:${IMGPROXY_PORT:-8080}:8080'

  # ─── Media queue Redis prod overrides (M12) ──────────────────────────────────
  media-redis:
    restart: always
    volumes:
      # ZFS dataset mount — set MEDIA_REDIS_DATA_PATH in .env.prod
      # Example: MEDIA_REDIS_DATA_PATH=/mnt/tank/narrative/media-redis
      - ${MEDIA_REDIS_DATA_PATH:-media_redis_data}:/data
    ports:
      # Admin access via SSH tunnel only; worker talks via Docker internal network.
      - '127.0.0.1:${MEDIA_REDIS_PORT:-6380}:6379'

  # ─── Video worker prod overrides (M12) ───────────────────────────────────────
  video-worker:
    restart: always
    # TODO M29: add resource limits once load profile is known.
    # Example when ready:
    #   deploy:
    #     resources:
    #       limits:
    #         cpus: '2'
    #         memory: 4G
    #       reservations:
    #         cpus: '0.5'
    #         memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static web files — build pipeline copies them here (see deploy.sh)
      - web_static:/srv/web:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env var is required}
    depends_on:
      server:
        condition: service_healthy
      authentik-server:
        condition: service_started
      minio:
        condition: service_healthy
      imgproxy:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  web_static:
    driver: local
