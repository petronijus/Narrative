# Narrative — Docker Compose production override
#
# Použití: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Změny oproti base compose:
#   - Server ports binding na 127.0.0.1 (Caddy je před nimi)
#   - Caddy service s auto-TLS
#   - Postgres volume na ZFS dataset (PG_DATA_PATH env var)
#   - Restart policy `always`
#   - env_file: .env.prod (gitignored)

services:
  postgres:
    restart: always
    volumes:
      # ZFS dataset mount — user nastaví PG_DATA_PATH v .env.prod
      # Příklad: PG_DATA_PATH=/mnt/tank/narrative/postgres
      - ${PG_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    # Expose pouze na localhost — Caddy / server přistupují přes internal network
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  server:
    restart: always
    environment:
      NODE_ENV: production
      # V prod Caddy posílá Origin jako DOMAIN
      CORS_ORIGIN: https://${DOMAIN}
    ports:
      # Binding jen na 127.0.0.1 — Caddy reverse-proxuje
      - '127.0.0.1:${API_PORT:-3001}:3001'
      - '127.0.0.1:${HOCUSPOCUS_PORT:-3002}:3002'

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static web soubory — build pipeline je zkopíruje sem (viz deploy.sh)
      - web_static:/srv/web:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env var is required}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  web_static:
    driver: local
