# Narrative — Docker Compose production override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs base compose:
#   - Server ports bound to 127.0.0.1 (Caddy sits in front)
#   - Caddy serves plain HTTP on the internal Docker network only — TLS is
#     terminated by Cloudflare at the edge, then cloudflared tunnels back to caddy:80.
#   - cloudflared service runs the tunnel (TUNNEL_TOKEN required)
#   - Postgres / MinIO (+ minio-perms) / media-redis bind volumes (set *_DATA_PATH in .env.prod)
#   - MinIO + imgproxy + media-redis ports bound to 127.0.0.1 (admin access via SSH)
#   - video-worker restart=always; resource limits deferred to M29 [M12]
#   - Restart policy `always`
#   - env_file: .env.prod (gitignored)

services:
  postgres:
    restart: always
    volumes:
      # ZFS dataset mount — set PG_DATA_PATH in .env.prod
      # Example: PG_DATA_PATH=/mnt/tank/narrative/postgres
      - ${PG_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    # Expose only on localhost — Caddy / server access via internal network
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  server:
    restart: always
    environment:
      NODE_ENV: production
      # In prod Caddy sends Origin as DOMAIN
      CORS_ORIGIN: https://${DOMAIN}
      # A new image's preview and display variants are encoded right after
      # its upload, through the cache's internal address, so its first viewer
      # does not wait for them (apps/server/src/media/imgproxyWarm.ts).
      IMGPROXY_WARM_ENDPOINT: http://imgproxy-cache:80
      # Real client IP for the anonymous rate-limit buckets, the per-IP
      # pre-limit and the WebSocket failed-auth throttle. Every request reaches
      # the server from Caddy's container address, so without this all
      # anonymous traffic would share one bucket. Cloudflare's edge sets
      # CF-Connecting-IP on every tunnelled request (overwriting a client-sent
      # one), and Caddy overwrites it for any peer that is not cloudflared
      # (CLOUDFLARED_TRUSTED_PROXIES below). Fastify's trustProxy stays off —
      # see apps/server/src/http/rateLimit.ts.
      CLIENT_IP_HEADER: cf-connecting-ip
      # MCP server + its OAuth authorization server (docs/mcp.md). The public
      # base of the API: the MCP resource is <base>/mcp — exactly the URL
      # users paste into claude.ai — and every OAuth token is bound to it.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://${DOMAIN}/api}
      # Extra OAuth redirect URIs besides the built-in claude.ai and Claude
      # Code callbacks (comma-separated; https, or http loopback). Usually empty.
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-}
      # Hosts whose OAuth Client ID Metadata Documents are accepted
      # (comma-separated; `none` = none). claude.ai serves Claude Code's.
      MCP_OAUTH_CIMD_HOSTS: ${MCP_OAUTH_CIMD_HOSTS:-claude.ai}
      # OAuth dynamic client registration (RFC 7591). Off: Claude Code and
      # claude.ai use metadata documents.
      MCP_OAUTH_DCR_ENABLED: ${MCP_OAUTH_DCR_ENABLED:-false}
      # Hostnames agent URL downloads may reach without the user confirming
      # the host (comma-separated, exact). Empty: every download is confirmed.
      AGENT_URL_FETCH_ALLOWED_HOSTS: ${AGENT_URL_FETCH_ALLOWED_HOSTS:-}
      # HMAC key of the opaque "working for" key on agent peers (awareness).
      # REQUIRED in prod (server refuses to start without it, >= 32 chars).
      # Generate: openssl rand -base64 48
      AGENT_PRINCIPAL_KEY_SECRET: ${AGENT_PRINCIPAL_KEY_SECRET:?AGENT_PRINCIPAL_KEY_SECRET env var is required}
      # The restore marker (ADR 0017): backup.sh writes the instance's restore
      # generation here after every dump, outside Postgres; a boot that finds
      # the database below it was restored and refuses every local document
      # copy browsers took before (apps/server/src/hocuspocus/instanceGeneration.ts).
      INSTANCE_MARKER_PATH: /var/lib/narrative/marker/generation
    volumes:
      # backups/ is never synced by a deploy (deploy.sh / remote-release.sh
      # exclude it), so the marker outlives every release; read-only here.
      - ${RESTORE_MARKER_DIR:-../backups/marker}:/var/lib/narrative/marker:ro
    ports:
      # Bind to 127.0.0.1 only — Caddy reverse-proxies
      - '127.0.0.1:${API_PORT:-3001}:3001'
      - '127.0.0.1:${HOCUSPOCUS_PORT:-3002}:3002'

  # ─── MinIO prod overrides (M11) ──────────────────────────────────────────────
  minio:
    restart: always
    volumes:
      # ZFS dataset mount — set MINIO_DATA_PATH in .env.prod
      # Example: MINIO_DATA_PATH=/mnt/tank/narrative/minio
      - ${MINIO_DATA_PATH:-minio_data}:/data
    ports:
      # Bind to localhost — Caddy + internal Docker network only
      - '127.0.0.1:${MINIO_API_PORT:-9100}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001'

  # Must see the same data as minio: the ZFS bind mount is root-owned on the
  # host, and minio runs as 65532 (docker-compose.yml → minio-perms).
  minio-perms:
    volumes:
      - ${MINIO_DATA_PATH:-minio_data}:/data

  imgproxy:
    restart: always
    environment:
      # Suppress verbose download error logs in prod; errors still tracked via Sentry (M29)
      IMGPROXY_REPORT_DOWNLOADING_ERRORS: 'false'
    ports:
      # Bind to localhost — the imgproxy-cache sidecar proxies to this port
      - '127.0.0.1:${IMGPROXY_PORT:-8080}:8080'

  imgproxy-cache:
    restart: always
    volumes:
      # ZFS dataset mount for the encoded-variant cache — set
      # IMGPROXY_CACHE_DATA_PATH in .env.prod (survives container recreation).
      # Example: IMGPROXY_CACHE_DATA_PATH=/mnt/tank/narrative/imgproxy-cache
      - ${IMGPROXY_CACHE_DATA_PATH:-imgproxy_cache}:/var/cache/imgproxy
    ports:
      # Bind to localhost — Caddy proxies /imgproxy/* to this port
      - '127.0.0.1:${IMGPROXY_CACHE_PORT:-8088}:80'

  # ─── Media queue Redis prod overrides (M12) ──────────────────────────────────
  media-redis:
    restart: always
    volumes:
      # ZFS dataset mount — set MEDIA_REDIS_DATA_PATH in .env.prod
      # Example: MEDIA_REDIS_DATA_PATH=/mnt/tank/narrative/media-redis
      - ${MEDIA_REDIS_DATA_PATH:-media_redis_data}:/data
    ports:
      # Admin access via SSH tunnel only; worker talks via Docker internal network.
      - '127.0.0.1:${MEDIA_REDIS_PORT:-6380}:6379'

  # ─── Video worker prod overrides (M12) ───────────────────────────────────────
  video-worker:
    restart: always
    # TODO M29: add resource limits once load profile is known.
    # Example when ready:
    #   deploy:
    #     resources:
    #       limits:
    #         cpus: '2'
    #         memory: 4G
    #       reservations:
    #         cpus: '0.5'
    #         memory: 512M

  # ─── Render worker prod overrides (agentic A3) ───────────────────────────────
  # The page opens on the public origin — the signed media URLs and the CSP
  # name it — while every request it makes goes to Caddy on the internal
  # network (RENDER_UPSTREAM, apps/render-worker/src/routing.ts), not out
  # through Cloudflare and back. Memory: Chromium runs only while there are
  # jobs (it quits after RENDER_IDLE_MS); the limit keeps a runaway render from
  # starving the server or Postgres on the 3 GB VM — measured in
  # docs/plans/a3-render-worker.md. 1200 MB since 0.10.25 (Petr, 2026-10-11):
  # one slide of a photo-heavy deck peaked at the old 900 MB and the kernel
  # killed Chromium's GPU process, leaving blank pictures; idle the worker
  # holds 100–200 MB, so the rest stays with the server between renders.
  render-worker:
    restart: always
    depends_on:
      caddy:
        condition: service_started
    environment:
      RENDER_APP_ORIGIN: https://${DOMAIN:?DOMAIN env var is required}
      RENDER_UPSTREAM: http://caddy
      # Two jobs at once (one person's slide beside another's export); the
      # second opens its page only with 450 MB free in this container
      # (apps/render-worker/src/memory.ts). Stated so a change is a decision.
      RENDER_CONCURRENCY: '2'
      RENDER_PAGE_RESERVE_MB: '450'
    mem_limit: 1200m
    # No swap past the limit: the worst case is a failed render, not a VM
    # swapping under the server and Postgres.
    memswap_limit: 1200m
    # SwiftShader paints on the CPU; two of the VM's four cores at most.
    cpus: 2

  caddy:
    image: caddy:2-alpine
    container_name: narrative-caddy
    restart: always
    # Also on the render worker's network: it is the worker's way to the app.
    networks: [default, render]
    # No published ports — Caddy is reachable only on the internal Docker network
    # via `caddy:80`. Public ingress is handled by the `cloudflared` service below.
    expose:
      - '80'
    volumes:
      # Mount the DIRECTORY, not the Caddyfile itself. A single-file bind mount
      # is pinned to the file's inode, and the deploy syncs config in with rsync,
      # which replaces files rather than rewriting them in place. The container
      # then keeps reading the old, unlinked inode: `caddy reload` reports
      # success, the file on the host shows the new config, and the served
      # headers are still the previous ones — which is exactly what happened to
      # the CSP change on 2026-09-09, and cost a confusing debugging round.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static web files — build pipeline copies them here (see deploy.sh)
      - web_static:/srv/web:ro
      # The desktop app's update feed (Caddyfile /desktop/*), written by
      # `just desktop-publish`; deploy.sh creates the directory.
      - ../desktop-feed:/srv/desktop-feed:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env var is required}
      # Peers whose CF-Connecting-IP header Caddy passes through (Caddyfile,
      # "Client IP"); every other peer gets it overwritten with its own
      # address. Here Caddy publishes no port, so its only peers are the
      # containers on the compose network, cloudflared among them — the
      # private ranges cover that network. The shared-tunnel overlay narrows
      # this to the external cloudflared host.
      CLOUDFLARED_TRUSTED_PROXIES: ${CLOUDFLARED_TRUSTED_PROXIES:-private_ranges}
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Caddy reverse-proxies /imgproxy/* to the cache sidecar, not imgproxy
      # directly — wait on the cache so the first image request isn't a 502.
      imgproxy-cache:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Outbound-only tunnel: no port forwarding, no Let's Encrypt. Cloudflare
  # terminates TLS at the edge and tunnels HTTP back to caddy:80.
  #
  # Setup (one time):
  #   1. https://one.dash.cloudflare.com → Networks → Tunnels → Create a tunnel
  #   2. Name it (e.g. "narrative"), copy the TUNNEL_TOKEN into .env.prod
  #   3. Public Hostname → service: http://caddy:80, hostname: narrative.YOURDOMAIN
  #   4. (Optional) repeat for minio.YOURDOMAIN → http://caddy:80
  #
  # The token contains everything cloudflared needs (tunnel UUID, account, secret),
  # so no extra config file is required.
  cloudflared:
    # Pin the cloudflared tag — :latest causes silent breakage on
    # `docker compose pull`. Find the current stable tag at
    # https://hub.docker.com/r/cloudflare/cloudflared/tags and bump
    # deliberately when validating new releases. CLOUDFLARED_VERSION is
    # set in .env.prod.
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?Set CLOUDFLARED_VERSION in .env.prod, e.g. 2024.10.1}
    container_name: narrative-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN env var is required}
    depends_on:
      caddy:
        condition: service_healthy

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  web_static:
    driver: local
  # Named fallback for the imgproxy cache when IMGPROXY_CACHE_DATA_PATH is unset.
  imgproxy_cache:
    driver: local
