# Narrative — Docker Compose (dev + prod-like local)
#
# Workflow:
#   dev (native):      docker compose up postgres authentik-postgres authentik-redis authentik-server authentik-worker
#                      → then pnpm dev
#   prod-like local:   docker compose up            → all services in containers
#   prod deploy:       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrative}
      POSTGRES_USER: ${POSTGRES_USER:-narrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-narrative} -d ${POSTGRES_DB:-narrative}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ../
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      API_PORT: ${API_PORT:-3001}
      HOCUSPOCUS_PORT: ${HOCUSPOCUS_PORT:-3002}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${API_PORT:-3001}:3001'
      - '${HOCUSPOCUS_PORT:-3002}:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Authentik OIDC Identity Provider (M10) ───────────────────────────────────
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
    volumes:
      - authentik_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authentik -d authentik']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 3

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      # Bootstrap credentials for first run only — used by akadmin setup flow
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@narrative.local}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - ./authentik/blueprints/custom:/blueprints/custom:ro
    ports:
      - '${AUTHENTIK_HTTP_PORT:-9000}:9000'

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.8.3
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-server:
        condition: service_started
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - ./authentik/blueprints/custom:/blueprints/custom:ro

  # ─── MinIO object storage (M11) ──────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_API_PORT:-9100}:9000' # S3 API (avoids collision with Authentik on 9000)
      - '${MINIO_CONSOLE_PORT:-9101}:9001' # Web console
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap — creates the narrative-media bucket if absent.
  # Uses mc (MinIO client) baked into the minio/mc image. Runs once on compose up,
  # then exits. A non-zero exit fails the stack — intentional, makes config drift loud.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${MEDIA_BUCKET:-narrative-media}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        (mc ls local/$$BUCKET_NAME || mc mb local/$$BUCKET_NAME) &&
        mc anonymous set download local/$$BUCKET_NAME &&
        echo 'Bucket ready: '$$BUCKET_NAME
      "
    restart: 'no'

  # ─── Media queue Redis (M12) — separate from Authentik's Redis ──────────────
  # Operational isolation rationale: auth Redis needs strict availability (sessions,
  # cache); media-redis can be wiped without user-visible impact and has a more
  # relaxed SLA. Keeping them separate also prevents queue traffic from affecting
  # auth latency. See ADR in docs/adr/.
  media-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - media_redis_data:/data
    # Append-only log + RDB snapshot every 60 s if >= 1000 writes.
    # In prod the snapshot file lands on a ZFS dataset; acceptable durability
    # for a job queue (worst case: re-enqueue in-flight jobs on crash).
    command: ['redis-server', '--save', '60', '1000', '--appendonly', 'yes']
    ports:
      - '${MEDIA_REDIS_PORT:-6380}:6379' # 6380 avoids colliding with a generic Redis on 6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Video transcode worker (M12) ────────────────────────────────────────────
  # Picks BullMQ jobs off media-redis, runs ffmpeg, uploads HLS variants + poster
  # + thumbnail to MinIO, updates media_assets via Postgres.
  # Phase 1a: container wired up, transcodeProcessor is a placeholder stub.
  # Phase 2 (media agent): replaces stub with real ffmpeg pipeline.
  video-worker:
    build:
      context: ../
      dockerfile: apps/video-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      media-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_URL: redis://media-redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-narrative-media}
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  # ─── imgproxy (M11) ──────────────────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.27
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required}
      IMGPROXY_ALLOWED_SOURCES: 'local://,http://minio:9000/,s3://'
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: 'http://minio:9000'
      IMGPROXY_S3_REGION: 'us-east-1' # MinIO default; must match mc alias config
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_CORS_ALLOW_ORIGIN: '*'
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - '${IMGPROXY_PORT:-8080}:8080'

volumes:
  postgres_data:
    driver: local
  authentik_pg_data:
    driver: local
  authentik_media:
    driver: local
  authentik_certs:
    driver: local
  minio_data:
    driver: local
  media_redis_data:
    driver: local
