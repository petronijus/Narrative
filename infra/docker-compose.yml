# Narrative — Docker Compose (dev + prod-like local)
#
# Workflow:
#   dev (native):      docker compose up postgres minio media-redis  → then pnpm dev
#                      (auth in dev runs with BYPASS_AUTH=true; no IdP container needed)
#   prod-like local:   docker compose up            → all services in containers
#   prod deploy:       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Project / container naming:
#   Top-level `name: narrative` sets the compose project name, so volumes and
#   networks are prefixed `narrative_*`. Each service also pins an explicit
#   `container_name: narrative-<svc>` so `docker ps` groups them visually.

name: narrative

services:
  postgres:
    image: postgres:16-alpine
    container_name: narrative-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrative}
      POSTGRES_USER: ${POSTGRES_USER:-narrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-narrative} -d ${POSTGRES_DB:-narrative}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ../
      dockerfile: apps/server/Dockerfile
    container_name: narrative-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      API_PORT: ${API_PORT:-3001}
      HOCUSPOCUS_PORT: ${HOCUSPOCUS_PORT:-3002}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${API_PORT:-3001}:3001'
      - '${HOCUSPOCUS_PORT:-3002}:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Identity provider ───────────────────────────────────────────────────────
  # Google OIDC is used directly (no self-hosted IdP container). The web client
  # talks to https://accounts.google.com via PKCE; the server validates ID tokens
  # against Google's JWKS and gates access via OIDC_ALLOWED_EMAILS / OIDC_ALLOWED_DOMAIN.
  # See README "Authentication" section for setup.

  # ─── MinIO object storage (M11) ──────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: narrative-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_API_PORT:-9100}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9101}:9001' # Web console
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap — creates the narrative-media bucket if absent.
  # Uses mc (MinIO client) baked into the minio/mc image. Runs once on compose up,
  # then exits. A non-zero exit fails the stack — intentional, makes config drift loud.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: narrative-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${MEDIA_BUCKET:-narrative-media}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        (mc ls local/$$BUCKET_NAME || mc mb local/$$BUCKET_NAME) &&
        mc anonymous set download local/$$BUCKET_NAME &&
        echo 'Bucket ready: '$$BUCKET_NAME
      "
    restart: 'no'

  # ─── Media queue Redis (M12) ─────────────────────────────────────────────────
  # Dedicated Redis for the BullMQ media queue. Can be wiped without user-visible
  # impact (jobs are recoverable on retry). Auth is Google OIDC — no auth Redis.
  media-redis:
    image: redis:7-alpine
    container_name: narrative-media-redis
    restart: unless-stopped
    volumes:
      - media_redis_data:/data
    # Append-only log + RDB snapshot every 60 s if >= 1000 writes.
    # In prod the snapshot file lands on a ZFS dataset; acceptable durability
    # for a job queue (worst case: re-enqueue in-flight jobs on crash).
    command: ['redis-server', '--save', '60', '1000', '--appendonly', 'yes']
    ports:
      - '${MEDIA_REDIS_PORT:-6380}:6379' # 6380 avoids colliding with a generic Redis on 6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Video transcode worker (M12) ────────────────────────────────────────────
  # Picks BullMQ jobs off media-redis, runs ffmpeg, uploads HLS variants + poster
  # + thumbnail to MinIO, updates media_assets via Postgres.
  # Phase 1a: container wired up, transcodeProcessor is a placeholder stub.
  # Phase 2 (media agent): replaces stub with real ffmpeg pipeline.
  video-worker:
    build:
      context: ../
      dockerfile: apps/video-worker/Dockerfile
    container_name: narrative-video-worker
    restart: unless-stopped
    depends_on:
      media-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_URL: redis://media-redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-narrative-media}
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  # ─── imgproxy (M11) ──────────────────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.27
    container_name: narrative-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required}
      IMGPROXY_ALLOWED_SOURCES: 'local://,http://minio:9000/,s3://'
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: 'http://minio:9000'
      IMGPROXY_S3_REGION: 'us-east-1' # MinIO default; must match mc alias config
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_CORS_ALLOW_ORIGIN: '*'
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - '${IMGPROXY_PORT:-8080}:8080'

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  media_redis_data:
    driver: local
