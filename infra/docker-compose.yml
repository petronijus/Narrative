# Narrative — Docker Compose (dev + prod-like local)
#
# Workflow:
#   dev (native):      docker compose up postgres minio media-redis  → then pnpm dev
#                      (auth in dev runs with BYPASS_AUTH=true; no IdP container needed)
#   prod-like local:   docker compose up            → all services in containers
#   prod deploy:       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Project / container naming:
#   Top-level `name: narrative` sets the compose project name, so volumes and
#   networks are prefixed `narrative_*`. Each service also pins an explicit
#   `container_name: narrative-<svc>` so `docker ps` groups them visually.

name: narrative

# MinIO server and client (mc) for minio, minio-perms and minio-init: Chainguard's
# maintained build, mirrored byte for byte into GHCR, because MinIO deleted
# minio/minio and minio/mc from Docker Hub (2026-09-11) and quay.io has no tags.
# The GHCR package is private: `docker login ghcr.io` once per machine. To refresh
# the mirror and bump this reference, see docs/storage.md → "MinIO image".
# tools/dev/doctor.sh and infra/scripts/verify-minio.sh read this line.
x-minio-image: &minio-image ghcr.io/petronijus/minio:RELEASE.2026-09-22T19-25-18Z@sha256:25bc63a89475bc494bfbce9bbeddb0421aece3f3968d77c809db5104d07b4545

services:
  postgres:
    image: postgres:16-alpine
    container_name: narrative-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrative}
      POSTGRES_USER: ${POSTGRES_USER:-narrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-narrative} -d ${POSTGRES_DB:-narrative}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    image: ghcr.io/petronijus/narrative-server:${NARRATIVE_TAG:-latest}
    build:
      context: ../
      dockerfile: apps/server/Dockerfile
    container_name: narrative-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      API_PORT: ${API_PORT:-3001}
      HOCUSPOCUS_PORT: ${HOCUSPOCUS_PORT:-3002}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Media (M11/M12/MEDIA-1): the server signs imgproxy URLs and short-TTL
      # presigned MinIO URLs (video playback + fonts). MINIO_ENDPOINT is the
      # INTERNAL address used to talk to MinIO; MINIO_PUBLIC_URL is the
      # browser-facing `/storage` base the presigned URLs are signed against
      # (must match the host Caddy serves, NOT the internal endpoint).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://${DOMAIN:-localhost}/storage}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-narrative-media}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ENDPOINT: ${IMGPROXY_ENDPOINT:-https://${DOMAIN:-localhost}/imgproxy}
    ports:
      - '${API_PORT:-3001}:3001'
      - '${HOCUSPOCUS_PORT:-3002}:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Identity provider ───────────────────────────────────────────────────────
  # Google OIDC is used directly (no self-hosted IdP container). The web client
  # talks to https://accounts.google.com via PKCE; the server validates ID tokens
  # against Google's JWKS and gates access via OIDC_ALLOWED_EMAILS / OIDC_ALLOWED_DOMAIN.
  # See README "Authentication" section for setup.

  # ─── MinIO object storage (M11) ──────────────────────────────────────────────
  # The image runs as the nonroot user 65532 (entrypoint /usr/bin/minio).
  minio:
    image: *minio-image
    container_name: narrative-minio
    restart: unless-stopped
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_API_PORT:-9100}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9101}:9001' # Web console
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot ownership fix for the MinIO data, run before every start of minio.
  # Data written by the old official image (minio/minio, which ran as root) is
  # root-owned, and the nonroot server refuses it ("Unable to write to the
  # backend"). Gives everything under /data to 65532:65532 and logs how many
  # entries actually changed (`chown -c`) — 0 once done. The image has GNU
  # coreutils but no findutils, hence chown -R rather than find.
  # The prod override gives it the same data volume as minio.
  minio-perms:
    image: *minio-image
    container_name: narrative-minio-perms
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        set -o pipefail;
        changed=$$(chown -R -c 65532:65532 /data | wc -l);
        echo "minio-perms: $$changed entries handed to 65532:65532"
    volumes:
      - minio_data:/data
    restart: 'no'

  # One-shot bucket bootstrap — creates the narrative-media bucket if absent.
  # Uses the mc (MinIO client) that ships in the MinIO image (Chainguard's
  # separate client image has no shell). Runs once on compose up, then exits.
  # A non-zero exit fails the stack — intentional, makes config drift loud.
  minio-init:
    image: *minio-image
    container_name: narrative-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${MEDIA_BUCKET:-narrative-media}
    # MEDIA-1: the bucket is PRIVATE — we intentionally do NOT grant any
    # anonymous policy. All media is served through short-TTL presigned URLs
    # (video playback, fonts) or imgproxy (images/posters/thumbnails, which
    # read MinIO server-side via s3://). A bare GET of /storage/<key> with no
    # X-Amz-* signature now 403s. Re-add `mc anonymous set download` here only
    # if you deliberately want a world-readable bucket again.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        (mc ls local/$$BUCKET_NAME || mc mb local/$$BUCKET_NAME) &&
        mc anonymous set none local/$$BUCKET_NAME &&
        echo 'Bucket ready (private, presigned-only): '$$BUCKET_NAME
      "
    restart: 'no'

  # ─── Media queue Redis (M12) ─────────────────────────────────────────────────
  # Dedicated Redis for the BullMQ media queue. Can be wiped without user-visible
  # impact (jobs are recoverable on retry). Auth is Google OIDC — no auth Redis.
  media-redis:
    image: redis:7-alpine
    container_name: narrative-media-redis
    restart: unless-stopped
    volumes:
      - media_redis_data:/data
    # Append-only log + RDB snapshot every 60 s if >= 1000 writes.
    # In prod the snapshot file lands on a ZFS dataset; acceptable durability
    # for a job queue (worst case: re-enqueue in-flight jobs on crash).
    command: ['redis-server', '--save', '60', '1000', '--appendonly', 'yes']
    ports:
      - '${MEDIA_REDIS_PORT:-6380}:6379' # 6380 avoids colliding with a generic Redis on 6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Video transcode worker (M12) ────────────────────────────────────────────
  # Picks BullMQ jobs off media-redis, runs ffmpeg, uploads HLS variants + poster
  # + thumbnail to MinIO, updates media_assets via Postgres.
  # Phase 1a: container wired up, transcodeProcessor is a placeholder stub.
  # Phase 2 (media agent): replaces stub with real ffmpeg pipeline.
  video-worker:
    image: ghcr.io/petronijus/narrative-video-worker:${NARRATIVE_TAG:-latest}
    build:
      context: ../
      dockerfile: apps/video-worker/Dockerfile
    container_name: narrative-video-worker
    restart: unless-stopped
    depends_on:
      media-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REDIS_URL: redis://media-redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-narrative-media}
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  # ─── imgproxy (M11) ──────────────────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.27
    container_name: narrative-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required}
      IMGPROXY_ALLOWED_SOURCES: 'local://,http://minio:9000/,s3://'
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: 'http://minio:9000'
      IMGPROXY_S3_REGION: 'us-east-1' # MinIO default; must match mc alias config
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_CORS_ALLOW_ORIGIN: '*'
      # AVIF tuning — the editor serves AVIF by default (smaller than WebP
      # at equal quality, current-Chrome target). AVIF_SPEED is 0 (slowest,
      # smallest) … 9 (fastest); 8 keeps encode cheap on a modest CPU while
      # the nginx cache (imgproxy-cache) ensures each variant encodes once.
      # FORMAT_QUALITY pins AVIF quality (~63 ≈ WebP 80) so files stay lean.
      IMGPROXY_AVIF_SPEED: ${IMGPROXY_AVIF_SPEED:-8}
      IMGPROXY_FORMAT_QUALITY: ${IMGPROXY_FORMAT_QUALITY:-avif=63}
      # Max SOURCE megapixels imgproxy will decode (decompression-bomb
      # guard). 50 MP is imgproxy's default and covers any realistic deck
      # image; set explicitly so the limit is visible/tunable.
      IMGPROXY_MAX_SRC_RESOLUTION: ${IMGPROXY_MAX_SRC_RESOLUTION:-50}
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - '${IMGPROXY_PORT:-8080}:8080'

  # ─── imgproxy disk cache (nginx) ─────────────────────────────────────────────
  # Open-source imgproxy has no result cache, so this nginx sidecar caches
  # each encoded variant on disk. Caddy routes /imgproxy/* here, not at
  # imgproxy directly. See infra/imgproxy-cache/nginx.conf for the rationale
  # (one-time AVIF encode instead of per-request — essential on a weak CPU).
  imgproxy-cache:
    image: nginx:1.27-alpine
    container_name: narrative-imgproxy-cache
    restart: unless-stopped
    depends_on:
      - imgproxy
    volumes:
      - ./imgproxy-cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - imgproxy_cache:/var/cache/imgproxy
    ports:
      - '${IMGPROXY_CACHE_PORT:-8088}:80'
    healthcheck:
      # imgproxy serves /health; nginx proxies it through location /.
      # busybox wget (-O -) is the portable form in nginx:alpine.
      # Use 127.0.0.1, NOT localhost: busybox wget resolves localhost to
      # ::1 first, but nginx only listens on IPv4 here, so `localhost`
      # makes the check fail ("can't connect") and the container reports
      # unhealthy despite serving fine. Same fix as the server healthcheck.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  media_redis_data:
    driver: local
  imgproxy_cache:
    driver: local
