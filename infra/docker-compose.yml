# Narrative — Docker Compose (dev + prod-like local)
#
# Workflow:
#   dev (nativní):     docker compose up postgres   → pnpm dev
#   prod-like local:   docker compose up            → všechno v containerech
#   prod deploy:       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrative}
      POSTGRES_USER: ${POSTGRES_USER:-narrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-narrative} -d ${POSTGRES_DB:-narrative}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ../
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${POSTGRES_USER:-narrative}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-narrative}
      API_PORT: ${API_PORT:-3001}
      HOCUSPOCUS_PORT: ${HOCUSPOCUS_PORT:-3002}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${API_PORT:-3001}:3001'
      - '${HOCUSPOCUS_PORT:-3002}:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
