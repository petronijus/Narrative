# Narrative — nginx disk cache in front of imgproxy.
#
# Why this exists: open-source imgproxy (the `darthsim/imgproxy` image we
# run) has NO result cache — that's a Pro-only feature. Without a cache,
# every browser cache-miss makes imgproxy re-encode the source from
# scratch. AVIF encoding is ~5-10× heavier than WebP, so on a modest
# self-hosted CPU that re-encode-on-every-request cost is the dominant
# bottleneck. This sidecar turns it into a one-time-per-variant cost:
# encode once, then serve straight off disk forever after.
#
# Cache key: the full signed request URI. Narrative's signed URLs are
# fully deterministic — the same (storageKey, variant, format) always
# produces the same path (signature + processing directive + s3 source +
# extension) — so $request_uri is a perfect, collision-free key.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log off;            # imgproxy + Caddy already log; keep the sidecar quiet
  error_log /dev/stderr warn;

  # 50 MB of keys (~hundreds of thousands of variants), 10 GB of bodies,
  # evicted after 90 days untouched. use_temp_path=off writes straight
  # into the cache tree (one less copy — matters on slow disks).
  proxy_cache_path /var/cache/imgproxy
    levels=1:2
    keys_zone=imgproxy:50m
    inactive=90d
    max_size=10g
    use_temp_path=off;

  # Signed imgproxy URLs are long (signature + s3 path + processing).
  large_client_header_buffers 4 16k;

  upstream imgproxy {
    server imgproxy:8080;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://imgproxy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;

      proxy_cache imgproxy;
      proxy_cache_key $request_uri;

      # A signed URL is immutable: its content can never change (the
      # signature pins storageKey + transform + format). So cache 2xx/3xx
      # aggressively and ignore any upstream header that would shorten it.
      # imgproxy's own Cache-Control is still forwarded to the BROWSER
      # (proxy_ignore_headers only affects nginx's own caching decision),
      # so client-side caching is unchanged.
      proxy_cache_valid 200 301 302 90d;
      proxy_cache_valid 400 403 404 1m;   # don't hammer imgproxy on a bad/expired sig
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_hide_header Set-Cookie;

      # Collapse a thundering herd: if N viewers open the same fresh image
      # at once, only ONE request reaches imgproxy to do the expensive
      # encode; the rest wait for it. Critical on a weak CPU.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 30s;

      # Keep serving a stale copy while a refresh happens / if imgproxy
      # hiccups, instead of surfacing the error to the user.
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;

      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
